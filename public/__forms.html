<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Formulaires</title></head>
<body>
<!-- Déclaration du formulaire pour Netlify Forms (non affiché sur le site). -->
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact">
  <input name="bot-field"><input name="nom"><input name="email" type="email">
  <select name="objet"><option>Question sur une commande</option><option>Bijou sur demande</option><option>Autre</option></select>
  <textarea name="projet"></textarea><textarea name="message"></textarea>
</form>
</body></html>
